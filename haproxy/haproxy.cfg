global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client  30s
    timeout server  3s
    retries 2
    option redispatch

frontend web
    bind :80
    # Anfragen pro 5 s je API-Schlüssel, nach 30 s ohne Anfrage vergessen
    stick-table type string len 64 size 100k expire 30s store gpc_rate(1,5s)
    http-request track-sc0 req.hdr(X-Api-Key) if { req.hdr(X-Api-Key) -m found }
    acl zu_viel sc_gpc_rate(0,0) ge 1000
    http-request return status 429 content-type text/plain string "zu viele" hdr Retry-After 1 if zu_viel
    # nur durchgelassene Anfragen zählen
    http-request sc-inc-gpc(0,0) if { req.hdr(X-Api-Key) -m found }
    default_backend kurz

backend kurz
    balance leastconn
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 16
    timeout queue 20ms
    # nach Timeout auf dem anderen Server wiederholen, aber nie ein POST
    retry-on conn-failure empty-response response-timeout
    http-request disable-l7-retry if METH_POST
    server s1 s1:8080 check
    server s2 s2:8080 check

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
